  <text x="360" y="22" text-anchor="middle" class="ttl">Figure 6 — Chief and marginal rays</text>
  <text x="360" y="40" text-anchor="middle" class="sub">The chief ray crosses the axis at the stop, EP, and XP; the marginal ray grazes their edges.</text>
