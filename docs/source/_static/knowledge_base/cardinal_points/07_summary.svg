  <text x="70" y="140" text-anchor="middle" class="lblb" fill="#7c3aed">EP</text>
  <line x1="650" y1="148" x2="650" y2="212" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="650" y="140" text-anchor="middle" class="lblb" fill="#7c3aed">XP</text>
  <text x="20" y="322" class="lblb">Reading the diagram</text>
  <text x="20" y="340" class="sub">• EP and XP are conjugate images of the aperture stop. The chief ray crosses the axis at the stop, EP and XP.</text>
  <text x="20" y="356" class="sub">• F, F' are the front and rear focal points — where parallel rays focus.</text>
  <text x="20" y="372" class="sub">• P, P' are the front and rear principal planes — measure f and f' from these.</text>
  <text x="20" y="388" class="sub">• N, N' are the nodal points (unit angular magnification). In air they coincide with P and P'.</text>
</svg>
