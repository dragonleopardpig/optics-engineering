<rect x="90" y="475" width="840" height="86" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<rect x="90" y="485" width="840" height="66" rx="2" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
