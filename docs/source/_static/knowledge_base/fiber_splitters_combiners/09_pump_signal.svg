<path d="M145 435 H255 C340 435 345 486 485 486" fill="none" stroke="#cbd5e1" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="1"/>
<path d="M145 435 H255 C340 435 345 490 485 490 L590 546 L690 490 L790 546 L900 490" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow-d97706)"/>
<text id="label-11" x="98" y="465" class="small" text-anchor="start">Continuous signal core</text>
<text id="label-12" x="590" y="450" class="small" text-anchor="start">Pump enters through the side</text>
<text id="label-13" x="490" y="590" class="small" text-anchor="middle">No signal-core splice is required at this coupling site.</text>
<rect x="26" y="644" width="948" height="52" rx="8" fill="#f0f7ff"/>
<text id="label-14" x="44" y="666" class="small" text-anchor="start">The pump does not become signal light in this passive component. Gain conversion occurs in the</text>
<text id="label-15" x="44" y="687" class="small" text-anchor="start">active fiber.</text>
</svg>
