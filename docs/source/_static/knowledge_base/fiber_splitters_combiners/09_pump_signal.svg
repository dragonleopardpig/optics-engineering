<text id="label-1" x="48" y="46" class="heading" text-anchor="start">Pump and signal use different guiding regions</text>
<text id="label-2" x="48" y="75" class="subheading" text-anchor="start">Blue denotes the signal core; orange denotes multimode pump light.</text>
