<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Reversing a splitter: fields determine the result</title>
<desc id="figure-description">Ideal two-input examples at the same wavelength, polarization, and spatial mode. Original conceptual illustration; not to scale.</desc>
