<text id="label-15" x="340" y="123" class="small" text-anchor="start">The branches remain mutually coherent.</text>
<text id="label-16" x="485" y="503" class="small" text-anchor="middle">Feedback minimizes the unwanted output; the coupler phase is part of the set point.</text>
<rect x="26" y="514" width="948" height="52" rx="8" fill="#f0f7ff"/>
<text id="label-17" x="44" y="536" class="small" text-anchor="start">The dashed path is electronic feedback. Pulses also need matched timing and dispersion.</text>
