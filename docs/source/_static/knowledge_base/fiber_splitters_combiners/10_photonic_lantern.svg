<text id="label-6" x="493" y="425" class="small" text-anchor="middle">Low loss in both directions requires matched modal capacity.</text>
<text id="label-7" x="493" y="456" class="small" text-anchor="middle">A standard lantern can map each input into a mixture of output modes.</text>
