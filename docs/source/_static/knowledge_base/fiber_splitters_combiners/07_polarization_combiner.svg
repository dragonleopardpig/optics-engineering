<text id="label-11" x="44" y="456" class="small" text-anchor="start">Arrow glyphs indicate polarization. The two inputs may have the same wavelength; phase locking is</text>
<text id="label-12" x="44" y="477" class="small" text-anchor="start">unnecessary.</text>
