<text id="label-8" x="500" y="360" class="" text-anchor="middle">Polarization-selective element</text>
<text id="label-9" x="820" y="335" class="" text-anchor="start">One output fiber</text>
<text id="label-10" x="500" y="398" class="small" text-anchor="middle">Micro-optic and fused-fiber implementations perform the same routing function.</text>
