name: Build and deploy documentation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Verify public documentation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          text_suffixes = {".rst", ".py", ".js", ".css", ".svg", ".html", ".ipynb", ".json"}
          matches = []
          for path in Path("docs/source").rglob("*"):
              if not path.is_file() or "__pycache__" in path.parts:
                  continue
              content = path.read_text(errors="replace") if path.suffix in text_suffixes else ""
              if re.search("kraken", str(path) + content, re.IGNORECASE):
                  matches.append(str(path))
          if matches:
              raise SystemExit("Private simulator references remain:\n" + "\n".join(matches))
          PY

      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html -d docs/build/doctrees docs/source docs/build/html

      - name: Verify notebook assets
        run: |
          test -s docs/build/html/lite/files/photodiode.py
          test -s docs/build/html/lite/files/ch03_photodiode_lab.ipynb

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
